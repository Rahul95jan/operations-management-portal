name: CI Checks

# Deployment itself is handled natively:
#   - Vercel's own GitHub integration deploys frontend/** to production on every
#     push to main, and creates a preview deployment for every PR.
#   - Render's own GitHub integration deploys backend/** to production on every
#     push to main.
# This workflow does NOT deploy anything — it only runs build checks on pull
# requests, so a broken build is caught before merge. Running a second deploy
# from here (e.g. via `vercel --prod`) would race with Vercel's own deploy for
# the same push and is deliberately not done.

on:
  pull_request:
    branches: [ main ]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt
      - run: python -c "import ast, pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('.').rglob('*.py') if 'venv' not in p.parts]"
